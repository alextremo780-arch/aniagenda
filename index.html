<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AniAgenda · Tu agenda de anime</title>
  <meta name="description" content="Tu temporada de anime, listas, vistos, favoritos, calendario semanal y alertas." />
  <meta name="theme-color" content="#0b0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AniAgenda" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://graphql.anilist.co" crossorigin />
  <link rel="preconnect" href="https://s4.anilist.co" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <!-- Barra lateral (escritorio) / barra inferior (móvil) -->
    <nav class="nav" aria-label="Navegación principal">
      <a class="brand" href="#/inicio" aria-label="AniAgenda inicio">
        <img src="./icons/icon-192.png" alt="" width="36" height="36" />
        <span>AniAgenda</span>
      </a>
      <a class="nav-item" href="#/inicio" data-route="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7" /><path d="M5 10v10h5v-6h4v6h5V10" /></svg>
        <span>Inicio</span>
      </a>
      <a class="nav-item" href="#/listas" data-route="listas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" /></svg>
        <span>Mis listas</span>
      </a>
      <a class="nav-item" href="#/calendario" data-route="calendario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
        <span>Calendario</span>
      </a>
      <a class="nav-item" href="#/buscar" data-route="buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <span>Buscar</span>
      </a>
      <a class="nav-item" href="#/perfil" data-route="perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" /></svg>
        <span>Perfil</span>
        <i class="nav-dot" id="navDot" hidden></i>
      </a>
      <div class="nav-foot">
        <p>Datos de <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a></p>
        <p id="tzLabel"></p>
      </div>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <div id="todayBanner"></div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Hoja de detalle -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>

  <!-- Diálogos pequeños (puntuar, ¿qué veo hoy?, listas) -->
  <div class="dialog-backdrop" id="dialogBackdrop" hidden></div>
  <section class="dialog" id="dialog" role="dialog" aria-modal="true" hidden></section>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="./app.js" defer></script>
</body>
</html>
